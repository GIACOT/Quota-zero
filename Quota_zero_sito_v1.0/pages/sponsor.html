<!doctype html>
<html lang="it">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="Convenzioni per i tesserati Quota Zero: noleggio e attrezzatura, skipass scontati per la stagione 2026/2027.">
  <title>Convenzioni | Quota Zero</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/convenzioni.css">
  <script defer src="../js/main.js"></script>
  <script defer src="../js/convenzioni.js"></script>
</head>

<body>
  <div id="site-header"></div>
  <script src="../js/layout.js" data-root="../"></script>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1>Convenzioni</h1>
        <p>Vantaggi esclusivi per i soci, con negozi e comprensori sciistici convenzionati.</p>
      </div>
    </section>

    <section class="section container conv-rental" id="noleggio">
      <h2>Noleggio e attrezzatura</h2>
      <div id="rental"></div>
    </section>

    <div class="conv-band">
      <section class="section container" id="skipass">
        <h2>Stagione 2026/2027</h2>
        <p class="conv-lead">Sconti sugli skipass giornalieri nei comprensori convenzionati.</p>
        <div id="ski-grid" class="ski-grid"></div>
        <p id="conv-error" class="muted" hidden>Non riusciamo a caricare le convenzioni. Riprova tra poco.</p>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>
</body>

</html>
